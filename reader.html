<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LILITH BLACKWELL - Chapter Reader</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Reader-specific styles - Book-like formatting with pagination */
        :root {
            --page-height: calc(100vh - 200px);
        }
        
        .reader-container {
            max-width: 720px;
            margin: 0 auto;
            padding: 40px 40px 20px;
            background: linear-gradient(to bottom, var(--light-bg) 0%, #0a0d12 100%);
            min-height: 100vh;
        }
        
        #chapter-title {
            font-family: var(--font-heading);
            text-align: center;
            color: var(--accent-color);
            font-size: 1.8rem;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        
        /* Page container */
        .page-wrapper {
            position: relative;
            min-height: var(--page-height);
            overflow: hidden;
        }
        
        #chapter-content {
            font-family: var(--font-body);
            font-size: 1.15rem;
            line-height: 1.9;
            color: var(--text-color);
            letter-spacing: 0.2px;
            column-width: 100%;
            column-gap: 0;
            height: var(--page-height);
            overflow: hidden;
        }
        
        /* Hide the H1 since we show title separately */
        #chapter-content h1 {
            display: none;
        }
        
        #chapter-content h2 {
            font-family: var(--font-heading);
            text-align: center;
            color: var(--accent-hover);
            font-size: 1.6rem;
            margin: 50px 0 40px;
            letter-spacing: 2px;
        }
        
        #chapter-content h3 {
            font-family: var(--font-heading);
            text-align: center;
            color: var(--text-muted);
            font-size: 1.2rem;
            font-style: italic;
            margin: 30px 0 50px;
        }
        
        /* Regular paragraphs - book style */
        #chapter-content p {
            text-indent: 2em;
            margin: 0 0 0.8em 0;
            text-align: left;
        }
        
        /* First paragraph after headers - no indent, with drop cap */
        #chapter-content h2 + p,
        #chapter-content h3 + p {
            text-indent: 0;
        }
        
        #chapter-content h2 + p::first-letter,
        #chapter-content h3 + p::first-letter {
            font-family: var(--font-heading);
            font-size: 4.5rem;
            float: left;
            line-height: 0.8;
            padding-right: 14px;
            padding-top: 8px;
            color: var(--accent-color);
            font-weight: 600;
        }
        
        /* Short lines (like single words or phrases) - no indent, centered */
        #chapter-content p.short-line {
            text-indent: 0;
            text-align: center;
            margin: 0.4em 0;
            color: var(--text-muted);
            font-style: italic;
        }
        
        /* Emphasized single lines */
        #chapter-content p.emphasis-line {
            text-indent: 0;
            text-align: center;
            margin: 1.5em 0;
            font-style: italic;
        }
        
        /* Blockquotes for internal thoughts */
        #chapter-content blockquote {
            margin: 2em 1em;
            padding: 1em 1.5em;
            border-left: 3px solid var(--accent-color);
            font-style: italic;
            color: var(--text-muted);
            background: rgba(212, 168, 75, 0.05);
        }

        /* Scene breaks */
        #chapter-content hr {
            border: none;
            text-align: center;
            margin: 3em 0;
        }

        #chapter-content hr::before {
            content: '✦  ✦  ✦';
            font-size: 1rem;
            color: var(--accent-color);
            opacity: 0.5;
            letter-spacing: 1em;
        }
        
        /* Strong emphasis */
        #chapter-content strong {
            color: var(--white);
            font-weight: 600;
        }
        
        /* Italic */
        #chapter-content em {
            font-style: italic;
        }
        
        #chapter-nav {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }
        
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }
        
        .nav-btn {
            font-family: var(--font-ui);
            padding: 14px 28px;
            background: var(--card-bg);
            color: var(--accent-color);
            text-decoration: none;
            border: 1px solid var(--accent-color);
            border-radius: 6px;
            font-weight: 500;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .nav-btn:hover {
            background: var(--accent-color);
            color: var(--primary-color);
        }
        
        .nav-btn.disabled {
            opacity: 0.3;
            pointer-events: none;
            border-color: var(--border-color);
            color: var(--text-muted);
        }
        
        .nav-btn.list-btn {
            background: transparent;
        }
        
        /* Page Navigation */
        .page-nav {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin: 20px 0;
            padding: 15px 0;
            border-top: 1px solid var(--border-color);
            user-select: none;
        }
        
        .page-btn {
            font-family: var(--font-ui);
            padding: 12px 24px;
            background: transparent;
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .page-btn:hover:not(:disabled) {
            background: var(--accent-color);
            color: var(--primary-color);
        }
        
        .page-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: var(--border-color);
            color: var(--text-muted);
        }
        
        .page-indicator {
            font-family: var(--font-ui);
            color: var(--text-muted);
            font-size: 0.95rem;
            min-width: 100px;
            text-align: center;
        }
        
        /* Keyboard hint */
        .keyboard-hint {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.8rem;
            font-family: var(--font-ui);
            opacity: 0.6;
            margin-bottom: 10px;
        }
        
        .keyboard-hint kbd {
            display: inline-block;
            padding: 3px 8px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-family: inherit;
            margin: 0 2px;
        }
        
        .error {
            color: var(--error-color);
            text-align: center;
            font-size: 1.2rem;
            padding: 2rem;
            background: rgba(248, 81, 73, 0.1);
            border-radius: 8px;
        }
        
        /* Back to top */
        .back-to-top {
            text-align: center;
            margin-top: 50px;
        }
        
        .back-to-top a {
            font-family: var(--font-ui);
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s;
        }
        
        .back-to-top a:hover {
            color: var(--accent-color);
        }

        /* Reading tip */
        .reading-tip {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 1rem;
            font-family: var(--font-ui);
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="logo">LILITH BLACKWELL</a>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="chapters.html">Chapters</a></li>
                <li><a href="about.html">About</a></li>
            </ul>
            <div class="nav-auth">
                <div id="user-info">
                    <img id="user-avatar" src="" alt="User">
                    <span id="user-name"></span>
                </div>
                <button id="auth-button">Sign In</button>
            </div>
        </nav>
    </header>

    <main class="reader-container">
        <h1 id="chapter-title">Loading...</h1>
        
        <article id="chapter-content">
            <p>Loading chapter content...</p>
        </article>
        
        <nav id="chapter-nav"></nav>
        
        <div class="back-to-top">
            <a href="#top">&uarr; Back to Top</a>
            <p class="reading-tip">💡 Tip: Highlight any text to leave feedback!</p>
        </div>
    </main>

    <footer>
        <p>&copy; 2024-2026 LILITH BLACKWELL. All rights reserved.</p>
    </footer>

    <!-- Firebase & App Scripts -->
    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/reading-progress.js"></script>
    <script type="module" src="js/notes-highlight.js"></script>
    <script type="module" src="js/feedback-admin.js"></script>
    <script src="js/chapter-reader.js"></script>
</body>
</html>
