<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LILITH BLACKWELL - Chapter Reader</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Reader-specific styles */
        .reader-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        #chapter-title {
            text-align: center;
            color: #b8860b;
            font-size: 2rem;
            margin-bottom: 40px;
            border-bottom: 1px solid #333;
            padding-bottom: 20px;
        }
        
        #chapter-content {
            font-family: 'Georgia', 'Times New Roman', serif;
            font-size: 1.1rem;
            line-height: 1.9;
            color: #e0e0e0;
        }
        
        #chapter-content h1 {
            text-align: center;
            color: #b8860b;
            font-size: 2.5rem;
            margin: 40px 0 20px;
        }
        
        #chapter-content h2 {
            text-align: center;
            color: #d4a84b;
            font-size: 1.8rem;
            margin: 30px 0 15px;
        }
        
        #chapter-content h3 {
            text-align: center;
            color: #888;
            font-size: 1.3rem;
            font-style: italic;
            margin: 20px 0 30px;
        }
        
        #chapter-content p {
            text-indent: 2em;
            margin: 0 0 1em 0;
            text-align: justify;
        }
        
        #chapter-content p:first-of-type {
            text-indent: 0;
        }
        
        #chapter-content p:first-of-type::first-letter {
            font-size: 3rem;
            float: left;
            line-height: 1;
            padding-right: 10px;
            color: #b8860b;
        }
        
        #chapter-nav {
            margin-top: 60px;
            padding-top: 30px;
            border-top: 1px solid #333;
        }
        
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .nav-btn {
            padding: 12px 24px;
            background: #1a1a2e;
            color: #b8860b;
            text-decoration: none;
            border: 1px solid #b8860b;
            border-radius: 4px;
            transition: all 0.3s ease;
        }
        
        .nav-btn:hover {
            background: #b8860b;
            color: #1a1a2e;
        }
        
        .nav-btn.disabled {
            opacity: 0.3;
            pointer-events: none;
            border-color: #555;
            color: #555;
        }
        
        .nav-btn.list-btn {
            background: transparent;
        }
        
        .error {
            color: #ff6b6b;
            text-align: center;
            font-size: 1.2rem;
        }
        
        /* Back to top */
        .back-to-top {
            text-align: center;
            margin-top: 40px;
        }
        
        .back-to-top a {
            color: #666;
            text-decoration: none;
        }
        
        .back-to-top a:hover {
            color: #b8860b;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="logo">LILITH BLACKWELL</a>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="chapters.html">Chapters</a></li>
                <li><a href="about.html">About</a></li>
            </ul>
        </nav>
    </header>

    <main class="reader-container">
        <h1 id="chapter-title">Loading...</h1>
        
        <article id="chapter-content">
            <p>Loading chapter content...</p>
        </article>
        
        <nav id="chapter-nav"></nav>
        
        <div class="back-to-top">
            <a href="#top">&uarr; Back to Top</a>
        </div>
    </main>

    <footer>
        <p>&copy; 2024-2026 LILITH BLACKWELL. All rights reserved.</p>
    </footer>

    <script src="js/chapter-reader.js"></script>
</body>
</html>
